name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (Node.js ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [24, 26]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit

      - name: Type check
        run: npm run check

      - name: Test
        run: npm run test -- --run

      - name: Build
        run: npm run build

      # Tests import the source; this starts dist/index.cjs and checks the bundle
      # over HTTP. It also checks that the served OpenAPI document matches the source
      # and saves it to dist/openapi.json.
      - name: Smoke test the production build
        run: npm run smoke

      - name: Validate the OpenAPI document
        run: npx --yes @apidevtools/swagger-cli@4.0.4 validate dist/openapi.json

  # The pre-commit hook's checks, in its order: a failing step stops the job. Both tools
  # are pinned in package.json and shared with the hook. No npm install needed: the
  # scripts only call go run.
  repo-checks:
    name: Repository checks (repogov, demojify)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      # repogov validates .github/repogov-config.json, the .github/ layout (applyTo
      # front matter on .github/instructions/*.instructions.md) and Markdown line limits
      - name: Check repository governance
        run: npm run governance:check

      # demojify audits every text file and exits 1 if it finds emoji. Fix locally with
      # `npm run emoji:fix`.
      - name: Check for emoji
        run: npm run emoji:check
